services:
  painel:
    build: .
    image: apuracao-eleicoes:latest
    container_name: apuracao-eleicoes
    restart: unless-stopped
    environment:
      SYNC_INTERVALO_MIN: "5"   # de quantos em quantos minutos baixar do TSE
      TURNOS: "2,1"             # turnos sincronizados (o 1º turno só a cada 60 min)
      TURNOS_MUN: "2,1"         # turnos com resultado por município
      CACHE_DADOS_S: "30"       # cache dos snapshots no Cloudflare/navegador (segundos)
      CONCORRENCIA: "6"         # downloads simultâneos ao TSE
    volumes:
      - dados:/app/dados
    ports:
      # porta 80 do servidor -> 8080 do container; o Cloudflare (proxy, nuvem laranja) acessa por ela
      - "80:8080"

volumes:
  dados:
