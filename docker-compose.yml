services:
  painel:
    build: .
    image: apuracao-eleicoes:latest
    pull_policy: build        # imagem construída aqui a partir do Dockerfile, não existe em registry
    container_name: apuracao-eleicoes
    restart: unless-stopped
    environment:
      SYNC_BRASIL_S: "30"       # de quantos em quantos segundos conferir se o TSE publicou dados novos do Brasil
      SYNC_INTERVALO_MIN: "5"   # de quantos em quantos minutos baixar os boletins do exterior
      TURNOS: "2,1"             # turnos sincronizados (o 1º turno só a cada 60 min)
      TURNOS_MUN: "2,1"         # turnos com resultado por município
      CACHE_DADOS_S: "15"       # cache dos snapshots no Cloudflare/navegador (segundos)
      CONCORRENCIA: "4"         # downloads simultâneos ao TSE (menos = menos risco de bloqueio 429)
      # Os ritmos acima valem perto da votação (da véspera até 3 dias depois); fora disso cada coleta roda 2 vezes ao dia.
      SYNC_FORA_ELEICAO_H: "12"
      # A eleição acompanhada é descoberta sozinha na configuração do TSE (2028, 2030...). Só para testes:
      ELEICAO_CICLO: ${ELEICAO_CICLO:-}   # ex.: ele2024 força um ciclo
      # Azure Blob (opcional): os valores vêm do .env, que nunca vai para o Git. Vazios = pasta local (volume abaixo).
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_CONTAINER_PUBLICO: ${AZURE_CONTAINER_PUBLICO:-eleicoes}
      AZURE_CONTAINER_INTERNO: ${AZURE_CONTAINER_INTERNO:-eleicoes-interno}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_CLIENT_SECRET_EXPIRA: ${AZURE_CLIENT_SECRET_EXPIRA:-}
      DADOS_URL_PUBLICA: ${DADOS_URL_PUBLICA:-}   # de onde o navegador lê os dados (CDN); vazio = /dados/ deste servidor
    volumes:
      # Com Azure Blob configurado, nada é gravado aqui e o volume fica vazio.
      # Padrão: volume nomeado "<projeto>_dados" (com -p eleicoes, "eleicoes_dados"), que sobrevive a rebuild e redeploy.
      # Para guardar numa pasta do servidor, defina DADOS no .env com um caminho ABSOLUTO fora da pasta do projeto
      # (ferramentas de deploy costumam recriar a pasta do projeto e apagariam os dados).
      - ${DADOS:-dados}:/app/dados
    # sem porta publicada no host: só o Nginx Proxy Manager, na mesma rede, acessa o container
    expose:
      - "8080"
    networks:
      - npm

volumes:
  dados:

networks:
  npm:
    external: true
    name: ${NPM_REDE:?defina NPM_REDE no arquivo .env}   # rede do Nginx Proxy Manager
